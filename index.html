function voiceStop(){if(voiceCall)try{voiceCall.close()}catch(e){}voiceCall=null;voiceCalls.forEach(c=>{try{c.close()}catch(e){}});voiceCalls.clear();voiceGroup.forEach(a=>a.remove());voiceGroup.clear();if(voiceStream)voiceStream.getTracks().forEach(t=>t.stop());voiceStream=null;if(voiceDummy){try{voiceDummy.o.stop();voiceDummy.c.close()}catch(e){}voiceDummy=null}voicePromise=null;if(voiceAudio){voiceAudio.srcObject=null;voiceAudio.remove();voiceAudio=null}voiceStatus('');$('vmic').style.display=$('vspk').style.display='none'}
